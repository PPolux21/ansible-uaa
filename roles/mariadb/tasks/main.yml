---
- name: Instalar paquetes de MariaDB
  ansible.builtin.apt:
    name: "{{ mariadb_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configurar MariaDB para escuchar solo en localhost
  ansible.builtin.template:
    src: 60-uaa.cnf.j2
    dest: "{{ mariadb_config_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar MariaDB

- name: Asegurar que MariaDB esté activo y habilitado
  ansible.builtin.service:
    name: "{{ mariadb_service }}"
    state: started
    enabled: true

- name: Eliminar usuarios anónimos de MariaDB
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_user: root
    login_unix_socket: "{{ mariadb_socket }}"

- name: Eliminar la base de datos de prueba
  community.mysql.mysql_db:
    name: test
    state: absent
    login_user: root
    login_unix_socket: "{{ mariadb_socket }}"

- name: Verificar consulta local a MariaDB
  ansible.builtin.command: mariadb -N -B -e "SELECT VERSION();"
  register: mariadb_version
  changed_when: false
  tags: [validacion]

- name: Mostrar resultado de la consulta local
  ansible.builtin.debug:
    msg: "MariaDB responde en {{ inventory_hostname }}: {{ mariadb_version.stdout }}"
  tags: [validacion]
