[defaults]
# Ruta al inventario predeterminado del laboratorio
inventory = inventories/laboratorio/hosts.yml
# Ruta al directorio de roles en la raiz del proyecto
roles_path = roles
# Seguridad SSH: Mantener estricta la verificación de host keys (previene MITM)
host_key_checking = True
# Usuario remoto por defecto para todas las conexiones
remote_user = automatizacion
# Ruta a la llave privada Ed25519 generada en el Paso 3
private_key_file = ~/.ssh/ansible_uaa
# Detección silenciosa del intérprete Python en los nodos remotos
interpreter_python = auto_silent
# Deshabilitar la generación de archivos .retry ante fallos
retry_files_enabled = False

# --- FORMATO DE SALIDA MODERNO (YAML) ---
# Fuerza a usar el plugin por defecto nativo
stdout_callback = default
# Aplica el formato legible YAML al plugin por defecto
callback_result_format = yaml
# Aplica el formato estructurado también a los comandos ad-hoc de consola
bin_ansible_callbacks = True

[privilege_escalation]
# Cada playbook habilita sudo solo cuando lo necesita.
become = False
become_method = sudo
become_user = root
# Usar --ask-become-pass al ejecutar un playbook que requiera sudo.
become_ask_pass = False

[ssh_connection]
# Optimización de tuberías SSH para acelerar la ejecución
pipelining = False
