---
- name: Respaldo y recuperación de MariaDB
  hosts: databases
  become: true

  vars:
    resp_db: prueba_respaldo
    resp_tabla: registros
    resp_socket: /run/mysqld/mysqld.sock
    resp_dir: /var/backups/mariadb
    # Fecha y hora del servidor al recolectar facts: identifica el respaldo de esta ejecución.
    resp_fecha: "{{ ansible_facts['date_time']['date'] }}_{{ ansible_facts['date_time']['hour'] }}{{ ansible_facts['date_time']['minute'] }}{{ ansible_facts['date_time']['second'] }}"
    # Reporte en el nodo de control; el id de ejecución es la misma marca de tiempo.
    resp_dir_logs: "{{ playbook_dir }}/../logs/respaldo/{{ resp_fecha }}"
    resp_registros:
      - { id: 1, texto: "Alta de servidor srv-db-01", fecha: "2026-11-01" }
      - { id: 2, texto: "Instalacion de MariaDB 11.8", fecha: "2026-11-02" }
      - { id: 3, texto: "Configuracion de bind-address", fecha: "2026-11-03" }
      - { id: 4, texto: "Revision de usuarios anonimos", fecha: "2026-11-04" }
      - { id: 5, texto: "Inventario tecnico generado", fecha: "2026-11-05" }
      - { id: 6, texto: "Actualizacion de paquetes", fecha: "2026-11-06" }
      - { id: 7, texto: "Prueba de respaldo programada", fecha: "2026-11-07" }
      - { id: 8, texto: "Registro de control final", fecha: "2026-11-08" }

  # Todas las tareas de MariaDB entran como root por unix_socket: no hay contraseñas.
  module_defaults:
    community.mysql.mysql_db:
      login_user: root
      login_unix_socket: "{{ resp_socket }}"
    community.mysql.mysql_query:
      login_user: root
      login_unix_socket: "{{ resp_socket }}"

  tasks:
    - name: Fase preparar - base, tabla y datos de prueba
      tags: [preparar]
      block:
        - name: Crear base de datos de prueba
          community.mysql.mysql_db:
            name: "{{ resp_db }}"
            state: present
            encoding: utf8mb4

        - name: Consultar si la tabla de prueba existe
          community.mysql.mysql_query:
            login_db: information_schema
            query: >-
              SELECT COUNT(*) AS existe FROM TABLES
              WHERE TABLE_SCHEMA = %s AND TABLE_NAME = %s
            positional_args:
              - "{{ resp_db }}"
              - "{{ resp_tabla }}"
          register: resp_tabla_existe
          changed_when: false

        - name: Crear tabla de prueba
          community.mysql.mysql_query:
            login_db: "{{ resp_db }}"
            query: >-
              CREATE TABLE {{ resp_tabla }} (
                id INT UNSIGNED NOT NULL PRIMARY KEY,
                texto VARCHAR(100) NOT NULL,
                fecha DATE NOT NULL
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4
          when: resp_tabla_existe.query_result[0][0].existe | int == 0

        - name: Consultar ids existentes en la tabla de prueba
          community.mysql.mysql_query:
            login_db: "{{ resp_db }}"
            query: "SELECT id FROM {{ resp_tabla }}"
          register: resp_ids
          changed_when: false

        - name: Insertar registros de prueba faltantes
          community.mysql.mysql_query:
            login_db: "{{ resp_db }}"
            query: "INSERT INTO {{ resp_tabla }} (id, texto, fecha) VALUES (%s, %s, %s)"
            positional_args:
              - "{{ item.id }}"
              - "{{ item.texto }}"
              - "{{ item.fecha }}"
          loop: "{{ resp_registros | rejectattr('id', 'in', resp_ids.query_result[0] | map(attribute='id') | list) | list }}"
          loop_control:
            label: "{{ item.id }} - {{ item.texto }}"

    - name: Fase consulta_antes - estado de los datos antes del respaldo
      tags: [consulta_antes]
      block:
        - name: Contar filas y calcular checksum de la tabla (antes)
          community.mysql.mysql_query:
            login_db: "{{ resp_db }}"
            query:
              - "SELECT COUNT(*) AS filas FROM {{ resp_tabla }}"
              - "CHECKSUM TABLE {{ resp_tabla }}"
          register: resp_antes
          changed_when: false

        - name: Mostrar consulta antes del respaldo
          ansible.builtin.debug:
            msg:
              - "Base: {{ resp_db }} / Tabla: {{ resp_tabla }}"
              - "Filas: {{ resp_antes.query_result[0][0].filas }}"
              - "CHECKSUM TABLE: {{ resp_antes.query_result[1][0].Checksum }}"

    - name: Fase respaldar - respaldo con mariadb-dump y metadatos
      tags: [respaldar]
      block:
        - name: Consultar directorio de datos activo de MariaDB
          community.mysql.mysql_query:
            query: "SELECT @@datadir AS datadir"
          register: resp_datadir
          changed_when: false

        - name: Verificar que el respaldo queda fuera del directorio de datos activo
          ansible.builtin.assert:
            that:
              - not (resp_dir_norm.startswith(resp_datadir_norm) or resp_datadir_norm.startswith(resp_dir_norm))
            fail_msg: "{{ resp_dir }} se cruza con el datadir {{ resp_datadir_norm }}"
            success_msg: "{{ resp_dir }} está fuera del datadir {{ resp_datadir_norm }}"
          vars:
            # Se normaliza con '/' final para que /var/lib/mariadb no coincida con /var/lib/mariadb2.
            resp_dir_norm: "{{ resp_dir | regex_replace('/+$', '') ~ '/' }}"
            resp_datadir_norm: "{{ resp_datadir.query_result[0][0].datadir | regex_replace('/+$', '') ~ '/' }}"

        - name: Crear directorio de respaldos con permisos restringidos
          ansible.builtin.file:
            path: "{{ resp_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Definir rutas del respaldo y sus metadatos
          ansible.builtin.set_fact:
            resp_archivo: "{{ resp_dir }}/{{ resp_db }}_{{ resp_fecha }}.sql.gz"
            resp_meta: "{{ resp_dir }}/{{ resp_db }}_{{ resp_fecha }}.meta.json"

        - name: Contar filas y calcular checksum al momento del respaldo
          community.mysql.mysql_query:
            login_db: "{{ resp_db }}"
            query:
              - "SELECT COUNT(*) AS filas FROM {{ resp_tabla }}"
              - "CHECKSUM TABLE {{ resp_tabla }}"
          register: resp_estado_respaldo
          changed_when: false

        - name: Generar respaldo lógico comprimido con mariadb-dump
          community.mysql.mysql_db:
            name: "{{ resp_db }}"
            state: dump
            target: "{{ resp_archivo }}"
            single_transaction: true

        - name: Restringir permisos del archivo de respaldo
          ansible.builtin.file:
            path: "{{ resp_archivo }}"
            owner: root
            group: root
            mode: "0600"

        - name: Obtener tamaño y SHA-256 del respaldo
          ansible.builtin.stat:
            path: "{{ resp_archivo }}"
            checksum_algorithm: sha256
          register: resp_stat

        - name: Guardar archivo de metadatos junto al respaldo
          ansible.builtin.copy:
            dest: "{{ resp_meta }}"
            owner: root
            group: root
            mode: "0600"
            content: "{{ resp_metadatos | to_nice_json }}\n"
          vars:
            resp_metadatos:
              servidor: "{{ inventory_hostname }}"
              base: "{{ resp_db }}"
              tabla: "{{ resp_tabla }}"
              fecha: "{{ resp_fecha }}"
              herramienta: mariadb-dump (community.mysql.mysql_db, single-transaction, gzip)
              datadir: "{{ resp_datadir.query_result[0][0].datadir }}"
              archivo: "{{ resp_archivo }}"
              tamano_bytes: "{{ resp_stat.stat.size }}"
              sha256: "{{ resp_stat.stat.checksum }}"
              filas: "{{ resp_estado_respaldo.query_result[0][0].filas }}"
              checksum_tabla: "{{ resp_estado_respaldo.query_result[1][0].Checksum }}"

        - name: Mostrar resumen del respaldo
          ansible.builtin.debug:
            msg:
              - "Respaldo: {{ resp_archivo }}"
              - "Metadatos: {{ resp_meta }}"
              - "Tamaño: {{ resp_stat.stat.size }} bytes"
              - "SHA-256: {{ resp_stat.stat.checksum }}"
              - "Filas: {{ resp_estado_respaldo.query_result[0][0].filas }} / CHECKSUM TABLE: {{ resp_estado_respaldo.query_result[1][0].Checksum }}"

    - name: Fase perdida - pérdida controlada de los datos de prueba
      tags: [perdida]
      block:
        - name: Verificar que la pérdida solo afecta a la base de prueba
          ansible.builtin.assert:
            that:
              - resp_db == 'prueba_respaldo'
            fail_msg: "Pérdida cancelada: resp_db es '{{ resp_db }}', solo se permite 'prueba_respaldo'"
            success_msg: "Base autorizada para la pérdida controlada: {{ resp_db }}"

        - name: Buscar respaldos existentes antes de borrar
          ansible.builtin.find:
            paths: "{{ resp_dir }}"
            patterns: "{{ resp_db }}_*.sql.gz"
            file_type: file
          register: resp_previos

        - name: Verificar que existe al menos un respaldo antes de borrar
          ansible.builtin.assert:
            that:
              - resp_previos.matched > 0
            fail_msg: "Pérdida cancelada: no hay respaldos de {{ resp_db }} en {{ resp_dir }}"
            success_msg: "Respaldos disponibles: {{ resp_previos.matched }}"

        - name: Borrar la tabla de prueba (pérdida controlada)
          community.mysql.mysql_query:
            login_db: "{{ resp_db }}"
            query: "DROP TABLE IF EXISTS {{ resp_tabla }}"

        - name: Confirmar que la tabla de prueba ya no existe
          community.mysql.mysql_query:
            login_db: information_schema
            query: >-
              SELECT COUNT(*) AS existe FROM TABLES
              WHERE TABLE_SCHEMA = %s AND TABLE_NAME = %s
            positional_args:
              - "{{ resp_db }}"
              - "{{ resp_tabla }}"
          register: resp_tras_perdida
          changed_when: false
          failed_when: resp_tras_perdida.query_result[0][0].existe | int != 0

    - name: Localizar el respaldo más reciente y sus metadatos
      tags: [restaurar, verificar]
      block:
        - name: Buscar respaldos de la base de prueba
          ansible.builtin.find:
            paths: "{{ resp_dir }}"
            patterns: "{{ resp_db }}_*.sql.gz"
            file_type: file
          register: resp_respaldos
          failed_when: resp_respaldos.matched == 0

        - name: Seleccionar el respaldo más reciente
          ansible.builtin.set_fact:
            # El nombre lleva AAAA-MM-DD_HHMMSS, así que el orden alfabético es cronológico.
            resp_ultimo: "{{ (resp_respaldos.files | sort(attribute='path') | last).path }}"

        - name: Leer metadatos del respaldo seleccionado
          ansible.builtin.slurp:
            src: "{{ resp_ultimo | regex_replace('\\.sql\\.gz$', '.meta.json') }}"
          register: resp_meta_raw

        - name: Cargar metadatos del respaldo
          ansible.builtin.set_fact:
            resp_meta_datos: "{{ resp_meta_raw.content | b64decode | from_json }}"

        - name: Obtener SHA-256 actual del respaldo seleccionado
          ansible.builtin.stat:
            path: "{{ resp_ultimo }}"
            checksum_algorithm: sha256
          register: resp_ultimo_stat

        - name: Verificar integridad del respaldo contra sus metadatos
          ansible.builtin.assert:
            that:
              - resp_ultimo_stat.stat.checksum == resp_meta_datos.sha256
              - resp_meta_datos.base == resp_db
            fail_msg: "El respaldo {{ resp_ultimo }} no coincide con sus metadatos"
            success_msg: "Respaldo íntegro: {{ resp_ultimo }} (SHA-256 {{ resp_meta_datos.sha256 }})"

    - name: Fase restaurar - importar el respaldo más reciente
      tags: [restaurar]
      block:
        - name: Verificar que la restauración solo afecta a la base de prueba
          ansible.builtin.assert:
            that:
              - resp_db == 'prueba_respaldo'
            fail_msg: "Restauración cancelada: resp_db es '{{ resp_db }}', solo se permite 'prueba_respaldo'"
            success_msg: "Base autorizada para la restauración: {{ resp_db }}"

        - name: Restaurar el respaldo en la base de prueba
          # El módulo ejecuta 'mariadb --one-database': solo aplica sentencias de resp_db.
          community.mysql.mysql_db:
            name: "{{ resp_db }}"
            state: import
            target: "{{ resp_ultimo }}"

    - name: Fase verificar - comparación de datos y puerto 3306
      tags: [verificar]
      block:
        - name: Contar filas y calcular checksum de la tabla (después)
          community.mysql.mysql_query:
            login_db: "{{ resp_db }}"
            query:
              - "SELECT COUNT(*) AS filas FROM {{ resp_tabla }}"
              - "CHECKSUM TABLE {{ resp_tabla }}"
          register: resp_despues
          changed_when: false

        - name: Comparar datos restaurados contra los metadatos del respaldo
          ansible.builtin.set_fact:
            resp_filas_despues: "{{ resp_despues.query_result[0][0].filas | int }}"
            resp_checksum_despues: "{{ resp_despues.query_result[1][0].Checksum | int }}"
            resp_resultado: >-
              {{ 'OK' if (resp_despues.query_result[0][0].filas | int == resp_meta_datos.filas | int
                          and resp_despues.query_result[1][0].Checksum | int == resp_meta_datos.checksum_tabla | int)
                 else 'FAILED' }}

        - name: Consultar sockets TCP en escucha en el puerto 3306
          ansible.builtin.command: ss -ltnH sport = :3306
          register: resp_ss
          changed_when: false

        - name: Evaluar direcciones de escucha de MariaDB
          ansible.builtin.set_fact:
            resp_escucha: "{{ resp_ss.stdout_lines | map('split') | map(attribute=3) | list }}"
            resp_puerto_ok: >-
              {{ (resp_ss.stdout_lines | length > 0)
                 and (resp_ss.stdout_lines | map('split') | map(attribute=3) | reject('equalto', '127.0.0.1:3306') | list | length == 0) }}

        - name: Mostrar resultado de la recuperación
          ansible.builtin.debug:
            msg:
              - "Respaldo restaurado: {{ resp_ultimo }}"
              - "Antes (metadatos): {{ resp_meta_datos.filas }} filas / CHECKSUM {{ resp_meta_datos.checksum_tabla }}"
              - "Después: {{ resp_filas_despues }} filas / CHECKSUM {{ resp_checksum_despues }}"
              - "Resultado de recuperación: {{ resp_resultado }}"

        - name: Crear directorio del reporte en el nodo de control
          ansible.builtin.file:
            path: "{{ resp_dir_logs }}"
            state: directory
            mode: "0755"
          delegate_to: localhost
          become: false

        - name: Generar reporte de respaldo y recuperación
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/respaldo_reporte.log.j2"
            dest: "{{ resp_dir_logs }}/reporte.log"
            mode: "0644"
          delegate_to: localhost
          become: false

        - name: Mostrar ubicación del reporte
          ansible.builtin.debug:
            msg: "Reporte guardado en: logs/respaldo/{{ resp_fecha }}/reporte.log"

        - name: Verificar que MariaDB escucha solo en 127.0.0.1
          ansible.builtin.assert:
            that:
              - resp_puerto_ok | bool
            fail_msg: "MariaDB escucha fuera de localhost: {{ resp_escucha }}"
            success_msg: "MariaDB escucha solo en: {{ resp_escucha | join(', ') }}"

        - name: Confirmar resultado OK de la recuperación
          ansible.builtin.assert:
            that:
              - resp_resultado == 'OK'
            fail_msg: "Recuperación FAILED: los datos restaurados no coinciden con el respaldo"
            success_msg: "Recuperación OK"
