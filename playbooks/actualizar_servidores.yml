---
- name: Actualización de paquetes de los servidores
  hosts: all
  gather_facts: false

  vars:
    simular_fallo: false
    act_raiz_logs: "{{ playbook_dir }}/../logs/actualizacion"
    act_dir_logs: "{{ act_directorio.path }}"
    act_id_ejecucion: "{{ act_dir_logs | basename }}"

  tasks:
    - name: Comprobar modo de ejecución
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - not (simular_fallo | bool) or (ansible_play_hosts_all | length == 1)
        fail_msg: Usar ejecución normal y limitar la simulación de fallo a un solo host.
      run_once: true

    - name: Crear directorio de logs en el nodo de control
      ansible.builtin.file:
        path: "{{ act_raiz_logs }}"
        state: directory
        mode: "0700"
      run_once: true
      delegate_to: localhost

    - name: Reservar directorio único para la ejecución
      ansible.builtin.tempfile:
        path: "{{ act_raiz_logs }}"
        state: directory
        prefix: "{{ now(utc=true, fmt='%Y-%m-%d_%H%M%S_') }}"
      register: act_directorio
      run_once: true
      delegate_to: localhost

    - name: Registrar inicio
      ansible.builtin.set_fact:
        act_inicio: "{{ now(utc=true, fmt='%Y-%m-%d %H:%M:%SZ') }}"

    - name: Actualizar servidor y registrar resultado
      # Mantiene el host en el play para escribir su log aun si cae SSH.
      ignore_unreachable: true
      when: not act_sin_conexion
      vars:
        act_sin_conexion: >-
          {{ [
            act_cache | default({}), act_simulacion | default({}),
            act_upgrade | default({}), act_simulacion_despues | default({}),
            act_reinicio_archivo | default({}), act_reinicio_pkgs_archivo | default({}),
            act_reinicio_pkgs_contenido | default({})
          ] | select('unreachable') | list | length > 0 }}
      block:
        - name: Simular fallo controlado antes de tocar apt
          ansible.builtin.fail:
            msg: Fallo controlado activado con simular_fallo=true.
          when: simular_fallo | bool

        - name: Actualizar caché de apt
          ansible.builtin.apt:
            update_cache: true
          become: true
          register: act_cache
          no_log: true
          changed_when: false

        - name: Simular actualización para contar paquetes pendientes antes
          ansible.builtin.command: apt-get -s upgrade --with-new-pkgs
          register: act_simulacion
          no_log: true
          changed_when: false

        - name: Guardar lista de paquetes pendientes antes
          ansible.builtin.set_fact:
            act_pendientes_lista: "{{ act_simulacion.stdout_lines | select('match', '^Inst ') | map('regex_replace', '^Inst (\\S+).*$', '\\1') | list }}"

        - name: Aplicar actualización de paquetes
          ansible.builtin.apt:
            upgrade: safe
            force_apt_get: true
          become: true
          register: act_upgrade
          no_log: true

        - name: Simular actualización para contar paquetes pendientes después
          ansible.builtin.command: apt-get -s upgrade --with-new-pkgs
          register: act_simulacion_despues
          no_log: true
          changed_when: false

        - name: Guardar lista de paquetes pendientes después
          ansible.builtin.set_fact:
            act_pendientes_despues: "{{ act_simulacion_despues.stdout_lines | select('match', '^Inst ') | map('regex_replace', '^Inst (\\S+).*$', '\\1') | list }}"

        - name: Comprobar si el sistema pide reinicio
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: act_reinicio_archivo

        - name: Comprobar si existe la lista de paquetes que piden reinicio
          ansible.builtin.stat:
            path: /var/run/reboot-required.pkgs
          register: act_reinicio_pkgs_archivo

        - name: Leer paquetes que piden reinicio
          ansible.builtin.slurp:
            src: /var/run/reboot-required.pkgs
          register: act_reinicio_pkgs_contenido
          when: act_reinicio_pkgs_archivo.stat.exists

        - name: Guardar estado de reinicio y resultado
          ansible.builtin.set_fact:
            act_estado: OK
            act_reinicio: "{{ act_reinicio_archivo.stat.exists }}"
            act_reinicio_pkgs: "{{ (act_reinicio_pkgs_contenido.content | b64decode).splitlines() | unique | list if act_reinicio_pkgs_archivo.stat.exists else [] }}"

      rescue:
        - name: Registrar causa sin copiar salidas que puedan contener credenciales
          ansible.builtin.set_fact:
            act_estado: FAILED
            act_error: >-
              {{ ansible_failed_task.name }}: {% if simular_fallo | bool %}fallo de prueba, sin cambios de paquetes.
              {% elif act_detalle is search('sudo|become') %}revisar sudo de automatizacion.
              {% elif act_detalle is search('could not get lock|unable to acquire|failed to lock') %}apt/dpkg ocupado.
              {% elif act_detalle is search('no space left|not enough free space') %}espacio insuficiente.
              {% elif act_detalle is search('dpkg.*(error|interrupt)') %}dpkg informó un error de paquetes.
              {% elif ansible_failed_result.rc is defined %}código {{ ansible_failed_result.rc }}, revisar diagnóstico local de la tarea.
              {% else %}revisar diagnóstico local de la tarea.
              {% endif %}
          vars:
            act_detalle: "{{ (ansible_failed_result.msg | default('') ~ ' ' ~ ansible_failed_result.stderr | default('')) | lower }}"

    - name: Registrar fin y completar el estado si se perdió la conexión
      ansible.builtin.set_fact:
        act_fin: "{{ now(utc=true, fmt='%Y-%m-%d %H:%M:%SZ') }}"
        act_estado: "{{ act_estado | default('UNREACHABLE') }}"
        act_error: "{{ act_error | default('Conexión SSH no disponible' if act_estado is undefined else '-') }}"

    - name: Generar log del servidor en el nodo de control
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/actualizacion_host.log.j2"
        dest: "{{ act_dir_logs }}/{{ inventory_hostname }}.log"
        mode: "0600"
      delegate_to: localhost

    - name: Generar resumen consolidado en el nodo de control
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/actualizacion_resumen.log.j2"
        dest: "{{ act_dir_logs }}/resumen.log"
        mode: "0600"
      run_once: true
      delegate_to: localhost

    - name: Mostrar ruta de los reportes
      ansible.builtin.debug:
        msg: "Logs y resumen en {{ act_dir_logs }}"
      run_once: true

    - name: Señalar resultados distintos de OK después de escribir los logs
      ansible.builtin.fail:
        msg: "{{ act_estado }}. {{ act_error | trim }} Consultar {{ act_dir_logs }}/{{ inventory_hostname }}.log"
      when: act_estado != 'OK'
