---
- name: Actualización de paquetes de los servidores
  hosts: all
  become: true
  gather_facts: true

  vars:
    act_dir_logs: "{{ playbook_dir }}/../logs/actualizacion/{{ act_id_ejecucion }}"

  tasks:
    - name: Generar identificador de ejecución
      ansible.builtin.set_fact:
        act_id_ejecucion: "{{ now(fmt='%Y-%m-%d_%H%M%S') }}"
      run_once: true

    - name: Crear directorio de logs de la ejecución en el nodo de control
      ansible.builtin.file:
        path: "{{ act_dir_logs }}"
        state: directory
        mode: "0755"
      run_once: true
      delegate_to: localhost
      become: false

    - name: Actualizar servidor y registrar resultado
      block:
        - name: Actualizar caché de apt
          ansible.builtin.apt:
            update_cache: true
          changed_when: false

        - name: Simular actualización para contar paquetes pendientes
          ansible.builtin.command: apt-get -s upgrade --with-new-pkgs
          register: act_simulacion
          changed_when: false

        - name: Guardar paquetes pendientes
          ansible.builtin.set_fact:
            act_pendientes_lista: "{{ act_simulacion.stdout_lines | select('match', '^Inst ') | map('regex_replace', '^Inst (\\S+).*$', '\\1') | list }}"

        - name: Guardar número de paquetes pendientes
          ansible.builtin.set_fact:
            act_pendientes: "{{ act_pendientes_lista | length }}"

        - name: Registrar inicio de la actualización
          ansible.builtin.set_fact:
            act_inicio: "{{ now(fmt='%Y-%m-%d %H:%M:%S') }}"

        - name: Aplicar actualización de paquetes
          ansible.builtin.apt:
            upgrade: safe
            force_apt_get: true
          register: act_upgrade

        - name: Comprobar si el sistema pide reinicio
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: act_reinicio_archivo

        - name: Comprobar si existe la lista de paquetes que piden reinicio
          ansible.builtin.stat:
            path: /var/run/reboot-required.pkgs
          register: act_reinicio_pkgs_archivo

        - name: Leer paquetes que piden reinicio
          ansible.builtin.slurp:
            src: /var/run/reboot-required.pkgs
          register: act_reinicio_pkgs_contenido
          when: act_reinicio_pkgs_archivo.stat.exists

        - name: Guardar estado de reinicio
          ansible.builtin.set_fact:
            act_reinicio: "{{ act_reinicio_archivo.stat.exists }}"
            act_reinicio_pkgs: "{{ (act_reinicio_pkgs_contenido.content | b64decode).splitlines() | unique | list if act_reinicio_pkgs_archivo.stat.exists else [] }}"

        - name: Registrar fin y estado de la actualización
          ansible.builtin.set_fact:
            act_fin: "{{ now(fmt='%Y-%m-%d %H:%M:%S') }}"
            act_estado: OK

      rescue:
        - name: Registrar fallo de la actualización
          ansible.builtin.set_fact:
            act_fin: "{{ now(fmt='%Y-%m-%d %H:%M:%S') }}"
            act_estado: FAILED
            act_error: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default('sin mensaje de error') }}"

      always:
        - name: Generar log del servidor en el nodo de control
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/actualizacion_host.log.j2"
            dest: "{{ act_dir_logs }}/{{ inventory_hostname }}.log"
            mode: "0644"
          delegate_to: localhost
          become: false

    - name: Generar resumen consolidado en el nodo de control
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/actualizacion_resumen.log.j2"
        dest: "{{ act_dir_logs }}/resumen.log"
        mode: "0644"
      run_once: true
      delegate_to: localhost
      become: false
