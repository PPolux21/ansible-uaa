---
- name: Gestionar Ubuntu Pro en el servidor administrativo
  hosts: management:&srv-admin-01
  gather_facts: false

  vars:
    ubuntu_pro_attach_enabled: false

  tasks:
    - name: Consultar estado de Ubuntu Pro
      ansible.builtin.command: pro status --format json
      register: pro_status
      changed_when: false
      check_mode: false
      no_log: true

    - name: Guardar solo si Ubuntu Pro está adjunto
      ansible.builtin.set_fact:
        pro_adjunto: "{{ (pro_status.stdout | from_json)['attached'] }}"
      no_log: true

    - name: Adjuntar Ubuntu Pro solo cuando esté autorizado
      when:
        - ubuntu_pro_attach_enabled | bool
        - not pro_adjunto
        - not ansible_check_mode
      block:
        - name: Cargar secreto cifrado de Ubuntu Pro
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../vars/vault/vault.yml"
          no_log: true

        - name: Verificar que el Vault contiene el token
          ansible.builtin.assert:
            that: (ubuntu_pro_token | default('') | length) > 0
          no_log: true

        - name: Adjuntar Ubuntu Pro en srv-admin-01
          ansible.builtin.command:
            argv:
              - pro
              - attach
              - "{{ ubuntu_pro_token }}"
          become: true
          no_log: true

        - name: Verificar el estado después del attach
          ansible.builtin.command: pro status --format json
          register: pro_status_despues
          changed_when: false
          failed_when: >-
            pro_status_despues.rc != 0 or
            not (pro_status_despues.stdout | from_json)['attached']
          no_log: true

        - name: Registrar el estado verificado
          ansible.builtin.set_fact:
            pro_adjunto: true

    - name: Mostrar estado sin datos de cuenta
      ansible.builtin.debug:
        msg: "Ubuntu Pro en {{ inventory_hostname }}: {{ 'adjunto' if pro_adjunto else 'no adjunto' }}"
