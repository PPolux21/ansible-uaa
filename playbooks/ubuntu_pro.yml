---
- name: Gestionar Ubuntu Pro en el servidor administrativo
  hosts: management
  become: true

  vars:
    ubuntu_pro_attach_enabled: false

  tasks:
    - name: Cargar secreto de Ubuntu Pro solo cuando se autorice attach
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/vault/ubuntu_pro.yml"
      when: ubuntu_pro_attach_enabled | bool
      no_log: true

    - name: Consultar estado de Ubuntu Pro
      ansible.builtin.command:
        cmd: pro status
      register: pro_status
      changed_when: false

    - name: Mostrar estado de Ubuntu Pro
      ansible.builtin.debug:
        var: pro_status.stdout_lines

    - name: Adjuntar Ubuntu Pro solo cuando este autorizado
      ansible.builtin.command:
        cmd: pro attach "{{ ubuntu_pro_token }}"
      when:
        - ubuntu_pro_attach_enabled | bool
        - ubuntu_pro_token is defined
      no_log: true

    - name: Imprimir reporte ejecutivo del playbook en terminal
      ansible.builtin.debug:
        msg: |
          ======================================================
          REPORTE DE EJECUCIÓN: GESTIÓN DE UBUNTU PRO
          ======================================================
          Objetivo: Consultar estado o adjuntar suscripción de Ubuntu Pro de manera segura.
          
          ESTADO FINAL DEL SERVIDOR:
          {% for host in ansible_play_hosts_all | sort %}
          {% if host in ansible_play_hosts %}
           - {{ host }}: OK (Estado consultado / Suscripción gestionada)
          {% else %}
           - {{ host }}: UNREACHABLE (Servidor apagado o sin red Hamachi)
          {% endif %}
          {% endfor %}
          
          INSTRUCCIONES DEL PLAY RECAP INFERIOR:
           -> 'unreachable>0': Ansible no pudo alcanzar la máquina por SSH/Hamachi.
           -> 'failed=0': La consulta o registro finalizó sin errores.
           -> 'changed>0': Se adjuntó exitosamente el token de Ubuntu Pro.
           -> 'changed=0': Solo se consultó el estado (attach deshabilitado) o ya estaba adjunto.
          ======================================================
      run_once: true
      delegate_to: localhost
      become: false
