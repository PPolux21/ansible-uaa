---
- name: Inventario técnico de los servidores
  hosts: all
  become: false
  gather_facts: true

  tasks:
    - name: Consultar estado de Ubuntu Pro
      ansible.builtin.command: pro status --format json
      register: inv_pro
      changed_when: false
      failed_when: false

    - name: Armar ficha técnica del servidor
      ansible.builtin.set_fact:
        inv_ficha:
          hostname: "{{ ansible_facts['hostname'] }}"
          ubuntu: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          ip_hamachi: "{{ ansible_facts['ham0']['ipv4']['address'] | default('sin ham0') }}"
          cpu_vcpus: "{{ ansible_facts['processor_vcpus'] }}"
          ram_mb: "{{ ansible_facts['memtotal_mb'] }}"
          disco_total_gb: "{{ (inv_raiz['size_total'] / 1024**3) | round(1) }}"
          disco_libre_gb: "{{ (inv_raiz['size_available'] / 1024**3) | round(1) }}"
          ubuntu_pro: "{{ 'no disponible' if inv_pro.rc != 0 else ('adjunto' if (inv_pro.stdout | from_json)['attached'] else 'no adjunto') }}"
      vars:
        inv_raiz: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | first }}"

    - name: Fijar fecha del reporte
      ansible.builtin.set_fact:
        inv_fecha: "{{ now(fmt='%Y-%m-%d') }}"
      run_once: true

    - name: Crear directorio de reportes de inventario en el nodo de control
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../logs/inventario"
        state: directory
        mode: "0755"
      run_once: true
      delegate_to: localhost
      become: false

    - name: Generar reporte consolidado de inventario
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/inventario_reporte.md.j2"
        dest: "{{ playbook_dir }}/../logs/inventario/inventario_{{ inv_fecha }}.md"
        mode: "0644"
      run_once: true
      delegate_to: localhost
      become: false

    - name: Imprimir reporte ejecutivo del playbook en terminal
      ansible.builtin.debug:
        msg: |
          ======================================================
          REPORTE DE EJECUCIÓN: INVENTARIO TÉCNICO
          ======================================================
          Objetivo: Recolectar información de hardware, red y sistema operativo.
          Fecha de recolección: {{ inv_fecha }}
          Reporte completo guardado en: logs/inventario/inventario_{{ inv_fecha }}.md
          
          ESTADO DE RECOLECCIÓN POR SERVIDOR:
          {% for host in ansible_play_hosts_all | sort %}
          {% set ficha = hostvars[host]['inv_ficha'] | default(none) %}
          {% if ficha %}
           - {{ host }}: OK (Ubuntu {{ ficha.ubuntu }}, IP Hamachi: {{ ficha.ip_hamachi }})
          {% else %}
           - {{ host }}: UNREACHABLE (Servidor apagado o inaccesible por SSH/Hamachi)
          {% endif %}
          {% endfor %}
          
          INSTRUCCIONES DEL PLAY RECAP INFERIOR:
           -> 'unreachable>0': Ansible no pudo alcanzar la máquina.
           -> 'failed>0': Ocurrió un error recolectando datos del sistema.
           -> 'changed>0': Se generó y actualizó el archivo Markdown del reporte localmente.
          ======================================================
      run_once: true
      delegate_to: localhost
      become: false
